<rect x="30" y="640" width="1220" height="112" rx="16" fill="#F3E9DC"/>
<text x="52" y="674" font-size="17.7" fill="#2A2520" font-weight="bold" text-anchor="start">中心库（SQLite）· 一个库管所有项目</text>
<text x="52" y="702" font-size="15.3" fill="#2A2520" font-weight="normal" text-anchor="start">工单 · 尝试 · 提交 · 证据 · 验收 · 合并记录</text>
