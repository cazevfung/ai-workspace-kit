<text x="45" y="456" font-size="14.8" fill="#2A2520" font-weight="normal" text-anchor="start">六节交接包</text>
<text x="45" y="478" font-size="14.2" fill="#8A7663" font-weight="normal" text-anchor="start">intake_gate 查缺节</text>
<text x="45" y="500" font-size="14.8" fill="#2A2520" font-weight="normal" text-anchor="start">过闸门就接手</text>
