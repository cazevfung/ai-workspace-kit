<text x="228" y="452" font-size="12.4" fill="#C4552D" font-weight="normal" text-anchor="middle">交进来</text>
<rect x="260" y="110" width="470" height="470" rx="22" fill="#2A2520"/>
<text x="290" y="154" font-size="26.0" fill="#FFFFFF" font-weight="bold" text-anchor="start">AI 工作区 · 你的 PM</text>
<text x="290" y="178" font-size="15.3" fill="#D9C9B6" font-weight="normal" text-anchor="start">从 PRD 开始，一张单负责到合并</text>
<rect x="285" y="200" width="420" height="66" rx="12" fill="#3A342D"/>
<text x="305" y="227" font-size="17.7" fill="#F5B98A" font-weight="bold" text-anchor="start">拆活</text>
<text x="348" y="227" font-size="15.3" fill="#F2E9DE" font-weight="normal" text-anchor="start">PRD → 工单</text>
<text x="305" y="252" font-size="13.6" fill="#C9BAA8" font-weight="normal" text-anchor="start">写清交付物、不做什么、验收条件</text>
<rect x="285" y="282" width="420" height="66" rx="12" fill="#3A342D"/>
<text x="305" y="309" font-size="17.7" fill="#F5B98A" font-weight="bold" text-anchor="start">派活</text>
<text x="348" y="309" font-size="15.3" fill="#F2E9DE" font-weight="normal" text-anchor="start">判断项目 → 开执行会话</text>
<text x="305" y="334" font-size="13.6" fill="#C9BAA8" font-weight="normal" text-anchor="start">上下文刚好够用：不多也不少</text>
<rect x="285" y="364" width="420" height="66" rx="12" fill="#3A342D"/>
<text x="305" y="391" font-size="17.7" fill="#F5B98A" font-weight="bold" text-anchor="start">盯活</text>
<text x="348" y="391" font-size="15.3" fill="#F2E9DE" font-weight="normal" text-anchor="start">收执 → 再分派</text>
<text x="305" y="416" font-size="13.6" fill="#C9BAA8" font-weight="normal" text-anchor="start">停住的活定期查库、续上</text>
<rect x="285" y="446" width="420" height="66" rx="12" fill="#3A342D"/>
<text x="305" y="473" font-size="17.7" fill="#F5B98A" font-weight="bold" text-anchor="start">收活</text>
<text x="348" y="473" font-size="15.3" fill="#F2E9DE" font-weight="normal" text-anchor="start">独立验收 → auto_merge</text>
<text x="305" y="498" font-size="13.6" fill="#C9BAA8" font-weight="normal" text-anchor="start">预演、测试、回退点、合并记录</text>
<text x="290" y="548" font-size="14.2" fill="#BFAE9C" font-weight="normal" text-anchor="start">工单是管理对象，会话是可替换的执行器</text>
