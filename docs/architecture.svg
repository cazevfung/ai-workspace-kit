<text x="1228" y="142" font-size="13.6" fill="#8A7663" font-weight="normal" text-anchor="end">每单一棵工作树</text>
<rect x="802" y="162" width="426" height="52" rx="10" fill="#F3E9DC"/>
<text x="822" y="185" font-size="15.3" fill="#2A2520" font-weight="bold" text-anchor="start">项目 A · 新功能</text>
<text x="822" y="204" font-size="13.6" fill="#8A7663" font-weight="normal" text-anchor="start">独立分支，主检出不动</text>
<rect x="802" y="228" width="426" height="52" rx="10" fill="#F3E9DC"/>
<text x="822" y="251" font-size="15.3" fill="#2A2520" font-weight="bold" text-anchor="start">项目 B · 流程改造</text>
<text x="822" y="270" font-size="13.6" fill="#8A7663" font-weight="normal" text-anchor="start">独立分支，主检出不动</text>
<rect x="802" y="294" width="426" height="52" rx="10" fill="#F3E9DC"/>
<text x="822" y="317" font-size="15.3" fill="#2A2520" font-weight="bold" text-anchor="start">项目 C · 另一条线</text>
<text x="822" y="336" font-size="13.6" fill="#8A7663" font-weight="normal" text-anchor="start">独立分支，主检出不动</text>
<rect x="780" y="410" width="470" height="78" rx="14" fill="#F6EFE4" stroke="#C4552D" stroke-width="1.8"/>
<text x="802" y="440" font-size="17.7" fill="#C4552D" font-weight="bold" text-anchor="start">独立验收</text>
<text x="802" y="464" font-size="14.8" fill="#2A2520" font-weight="normal" text-anchor="start">换一个会话判；做的人不能签字</text>
<rect x="780" y="518" width="470" height="92" rx="14" fill="#FDFBF7" stroke="#B9A894" stroke-width="1.8" stroke-dasharray="7 6"/>
<text x="802" y="548" font-size="17.7" fill="#2A2520" font-weight="bold" text-anchor="start">auto_merge</text>
<text x="802" y="574" font-size="14.8" fill="#2A2520" font-weight="normal" text-anchor="start">预演 → 跑测试 → 打回退点 → 合并 → 写记录</text>
<text x="802" y="596" font-size="13.6" fill="#8A7663" font-weight="normal" text-anchor="start">红了回到合并之前</text>
